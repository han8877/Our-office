<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>끄적끄적문구 · 픽셀 시안</title>
<style>
  /* 둥근모꼴(NeoDunggeunmo) — SIL OFL 1.1, assets/fonts/neodgm-LICENSE.txt */
  @font-face{ font-family:'NeoDGM'; src:url('assets/fonts/neodgm.woff2') format('woff2'); font-display:block; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#2a2530; overflow:hidden;
    font-family:'NeoDGM', monospace; -webkit-font-smoothing:none; -webkit-text-size-adjust:100%; }
  #view{ position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; cursor:grab; scrollbar-width:none; }
  #view::-webkit-scrollbar{ display:none; }
  #view.drag{ cursor:grabbing; }
  #stage{ position:relative; margin:64px auto 160px; }
  #world{ display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #labels{ position:absolute; left:0; top:0; pointer-events:none; }

  /* 책상 명패 */
  .plate{ position:absolute; font-size:16px; line-height:16px; color:#fff; white-space:nowrap;
    background:rgba(58,44,62,.82); padding:2px 6px; border-radius:4px; transform:translate(-50%,0);
    box-shadow:0 0 0 1px rgba(40,26,40,.5); }
  /* 벽 간판 글씨 */
  .sign{ position:absolute; font-size:16px; line-height:16px; color:#fff6e6; white-space:nowrap;
    transform:translate(-50%,-50%); text-shadow:1px 1px 0 #5e3a24; }

  /* 쯔꾸르 창 */
  .win{ position:fixed; color:#fff; font-size:16px; line-height:22px;
    background:linear-gradient(180deg, rgba(62,82,150,.95), rgba(28,38,92,.95));
    border:3px solid #eef2f8; border-radius:7px;
    box-shadow:0 0 0 2px #232a4a, inset 0 0 0 1px rgba(255,255,255,.2), 0 4px 0 rgba(0,0,0,.3);
    text-shadow:2px 2px 0 #10163a; }
  #mapName{ left:12px; top:calc(12px + env(safe-area-inset-top,0px)); padding:8px 14px; transition:opacity .9s; }
  #mapName small{ display:block; font-size:16px; color:#c3cfff; }
  #clock{ right:12px; top:calc(12px + env(safe-area-inset-top,0px)); padding:6px 12px; }
  #msg{ left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    max-width:760px; margin:0 auto; min-height:104px; padding:12px 16px 14px 108px; cursor:pointer; }
  #msgFace{ position:absolute; left:14px; top:13px; width:78px; height:78px; image-rendering:pixelated;
    background:rgba(255,255,255,.1); border-radius:5px; }
  #msgName{ display:block; color:#ffe39a; }
  #msgText{ display:block; min-height:44px; }
  #rTalk{ position:absolute; display:none; pointer-events:none; white-space:nowrap; font-size:16px; line-height:16px; color:#2e4a52;
    background:#ffffff; border:2px solid #6f9aa6; border-radius:8px; padding:4px 8px; transform:translate(-50%,-100%);
    box-shadow:0 2px 0 rgba(60,90,100,.25); }
  #rTalk:after{ content:''; position:absolute; left:50%; bottom:-7px; margin-left:-5px; border:5px solid transparent; border-top-color:#6f9aa6; border-bottom:0; }
  #msgNext{ position:absolute; right:14px; bottom:6px; animation:blink .8s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion:reduce){ #msgNext{ animation:none; } }
</style>
</head>
<body>
<div id="view"><div id="stage"><canvas id="world"></canvas><div id="labels"></div><div id="rTalk"></div></div></div>
<div id="mapName" class="win">끄적끄적문구 · 3층 사무실<small>화면을 끌어서 둘러보세요</small></div>
<div id="clock" class="win">--:--</div>
<div id="msg" class="win"><canvas id="msgFace" width="26" height="26"></canvas><span id="msgName"></span><span id="msgText"></span><span id="msgNext">▼</span></div>

<script src="assets/pixoffice.js"></script>
<script>
(function(){
'use strict';

// =====================================================================
//  기본 단위: 타일 32px. 맵은 36 × 30 칸. 그림은 이 원래 크기로 그리고
//  화면에는 정수배로 보여준다 (픽셀이 뭉개지지 않게).
//  색 원칙: 바닥·벽은 파스텔, 가구·책·화분은 알록달록, 가전은 실제 색.
// =====================================================================
var PO=window.PixOffice;
var T=PO.T, COLS=PO.COLS, ROWS=PO.ROWS, W=PO.W, H=PO.H, R=PO.R, P=PO.P, ell=PO.ell, disc=PO.disc, obj=PO.obj, rnd=PO.rnd, hash=PO.hash,
    bg=PO.bg, things=PO.things, blocked=PO.blocked, SIGNS=PO.SIGNS, STAFF=PO.STAFF, SEATS=PO.SEATS, buildSprites=PO.buildSprites,
    BALLOONS=PO.BALLOONS, pRobot=PO.pRobot, bfs=PO.bfs, phase=PO.phase, TINT=PO.TINT, SPR_TOP=PO.SPR_TOP;

var LINES = {
  kobujang:['여기서 보면 다 보여요. 별건 아니고요.','글쎄요. 그럴 수도 있죠.'],
  kimnote:['이 색 어때요? 아니 진짜로요 ㅋㅋ','표지 종이만 열 종류 봤어요~'],
  leenote:['아직 쓸 만한데요 뭐','오래 쓰면 손에 맞아요.'],
  jungnote:['차 한 잔 하실래요. 오늘은 보이차예요.','읽는 책이 좀 어렵습니다.'],
  hannote:['앗 제 텀블러 못 보셨어요?!','아 그거 좋은 생각 있어요!'],
  nabujang:['그거 저번에 견적 받아뒀어요. 만 이천 원이요.','세 군데는 비교해봐야죠.'],
  choiinsa:['밥은 드셨어요? 아까부터 안 나가시길래~','우리 집 고양이가요, 요즘 자꾸 책상에 올라와요 ㅎㅎ'],
  parkhoegye:['이번 달 정산 맞췄어요!','맞긴 한데요, 혹시 모르니까 한 번 더 볼게요.'],
  jungsti:['방금 찍은 건데 괜찮죠? 각도가 좋았어요','커피부터 좀 마시고요…'],
  hansti:['아 그거 버리지 마세요~ 쓸 데가 있어요','점심 뭐 먹지…'],
  yoosti:['저는 다 괜찮아요~','오늘 이 배지 달았어요~'],
  chosti:['주머니에 사탕 있어요, 드실래요?','오늘도 제일 먼저 왔어요!'],
  yoohongbo:['어제 전시 다녀왔는데요, 요즘은 다들 이렇게 하더라고요','금요일만 기다려요 ㅋㅋ'],
  seohongbo:['핸드크림 쓰실래요','오늘 좀 추워요'],
  minhongbo:['돼요! 금방 만들어드릴게요 ㅎㅎ','그럼 제가 뭐 해드릴까요?']
};

// ---- 사람 ----
var people=STAFF.map(function(p){
  var S=SEATS[p.id];
  var o={p:p,spr:buildSprites(p),seat:{c:S.c,r:S.r},seatX:S.seatX,seatFeet:S.seatFeet,
         x:S.seatX,feet:S.seatFeet,dir:'down',frame:0,state:'sit',until:0,path:null,step:0,tile:null,
         blinkUntil:0,nextBlink:0,balloon:null,balloonUntil:0};
  things.push({person:o}); return o;
});

var SPOTS=[
  {c:11,r:5,face:'up',b:'note'},  {c:2,r:5,face:'up',b:'heart'}, {c:17,r:5,face:'up',b:'dots'},
  {c:27,r:16,face:'up',b:'zzz'},  {c:30,r:26,face:'up',b:'heart'},{c:14,r:15,face:'up',b:'bulb'},
  {c:23,r:22,face:'up',b:'dots'}, {c:11,r:16,face:'up',b:'excl'}, {c:20,r:12,face:'down',b:'note'}
].filter(function(s){ return !blocked[s.r][s.c]; });
var WALKERS=['hannote','chosti','minhongbo','kimnote','hansti','seohongbo'];

var ROBOT={ spr:pRobot(false,0), roll:pRobot(false,1), blink:pRobot(true,0), tile:null, path:null, step:0, stepStart:0, x:0, feet:0, wait:0, talkUntil:0, nextBlink:0, blinkUntil:0 };
var R_LINES=['온도 적정','습도 적정','미세먼지 관리중','항균모드 작동','모기 박멸'];
var R_STEP=560;                       // 칸당 ms — 직원보다 느긋하게
var R_WAY=[[12,6],[12,13],[3,15],[9,15],[20,15],[25,17],[25,21],[20,12],[30,12],[8,23],[5,26],[2,26]]
  .map(function(p){ return {c:p[0],r:p[1]}; }).filter(function(t){ return !blocked[t.r][t.c]; });


// =====================================================================
//  시간 · 창밖
// =====================================================================
var FORCE=(function(){ var m=/[?&]t=(\d{3,4})/.exec(location.search); if(!m) return null; var v=m[1].padStart(4,'0'); return {h:+v.slice(0,2),m:+v.slice(2)}; })();
function nowHM(){ if(FORCE) return FORCE; var d=new Date(); return {h:d.getHours(),m:d.getMinutes()}; }
// =====================================================================
//  화면
// =====================================================================
var view=document.getElementById('view'), stage=document.getElementById('stage'), world=document.getElementById('world'),
    labels=document.getElementById('labels'), wc=world.getContext('2d');
world.width=W; world.height=H; wc.imageSmoothingEnabled=false;
var Z=1;
function relayout(){
  var vw=view.clientWidth, vh=view.clientHeight;
  Z=Math.max(1,Math.min(2,Math.floor(Math.min(vw/W,vh/H))));
  ['width','height'].forEach(function(k){ var v=(k==='width'?W:H)*Z+'px'; stage.style[k]=v; world.style[k]=v; labels.style[k]=v; });
  placeLabels();
}
function placeLabels(){
  labels.innerHTML='';
  SIGNS.forEach(function(s){ var el=document.createElement('div'); el.className='sign'; el.textContent=s[0];
    el.style.left=(s[1]*Z)+'px'; el.style.top=(s[2]*Z)+'px'; labels.appendChild(el); });
  people.forEach(function(o){ var el=document.createElement('div'); el.className='plate'; el.textContent=o.p.name;
    el.style.left=((o.seat.c*T+32)*Z)+'px'; el.style.top=(((o.seat.r+1)*T+20)*Z)+'px';   /* 책상 앞판에 붙인 명패 */ labels.appendChild(el); });
}
window.addEventListener('resize',relayout);

// 마우스로 끌어서 둘러보기 (폰은 기본 스크롤)
var drag=null, suppress=false;
view.addEventListener('mousedown',function(e){ drag={x:e.clientX,y:e.clientY,sl:view.scrollLeft,st:view.scrollTop,moved:false}; view.classList.add('drag'); });
window.addEventListener('mousemove',function(e){ if(!drag) return; var dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true; view.scrollLeft=drag.sl-dx; view.scrollTop=drag.st-dy; });
window.addEventListener('mouseup',function(){ if(drag&&drag.moved) suppress=true; drag=null; view.classList.remove('drag'); });
view.addEventListener('click',function(e){ if(suppress){ suppress=false; return; }
  var rc=stage.getBoundingClientRect(), nx=(e.clientX-rc.left)/Z, ny=(e.clientY-rc.top)/Z, hit=null;
  people.forEach(function(o){ var x=o.x, y=o.feet-48; if(nx>=x+4&&nx<=x+30&&ny>=y+6&&ny<=y+48){ if(!hit||o.feet>hit.feet) hit=o; } });
  if(hit){ say(hit); showBalloon(hit,'excl',1400); return; }
  if(nx>=ROBOT.x&&nx<=ROBOT.x+32&&ny>=ROBOT.feet-46&&ny<=ROBOT.feet) robotTalk(); });

// 대화창
var msgName=document.getElementById('msgName'), msgText=document.getElementById('msgText'), msgFace=document.getElementById('msgFace'), mfc=msgFace.getContext('2d');
var typing=null, lastSay=0;
function say(o){
  var ls=LINES[o.p.id]||['…'], text=ls[Math.floor(Math.random()*ls.length)];
  msgName.textContent=o.p.name; msgText.textContent='';
  mfc.clearRect(0,0,26,26); mfc.drawImage(o.spr.down[0],4,SPR_TOP+2,26,26,0,0,26,26);
  var i=0; if(typing) clearInterval(typing);
  typing=setInterval(function(){ i++; msgText.textContent=text.slice(0,i); if(i>=text.length){ clearInterval(typing); typing=null; } },45);
  lastSay=performance.now();
}
document.getElementById('msg').addEventListener('click',function(){ say(people[Math.floor(Math.random()*people.length)]); });
function showBalloon(o,kind,ms){ o.balloon=BALLOONS[kind]||BALLOONS.dots; o.balloonUntil=performance.now()+(ms||2000); }

// =====================================================================
//  움직임: 자리 → 걸어서 → 잠깐 머물고 → 자리로
// =====================================================================
var STEP_MS=300;
function startWalk(o,target,then){
  var from=(o.state==='sit'||!o.tile)?o.seat:o.tile, path=bfs({c:from.c,r:from.r},target);
  if(!path) return false;
  if(path.length<2){ o.tile={c:target.c,r:target.r}; then&&then(); return true; }
  o.path=path; o.step=0; o.stepStart=performance.now(); o.then=then; o.state='walk'; o.tile={c:path[0].c,r:path[0].r}; return true;
}
function tilePos(t){ return { x:t.c*T-1, feet:t.r*T+29 }; }
function update(o,now){
  if(now>o.nextBlink){ o.blinkUntil=now+140; o.nextBlink=now+2200+Math.random()*3800; }
  if(o.state==='sit'){
    if(o.walker&&now>o.until){
      var free=SPOTS.filter(function(s){ return !people.some(function(q){ return q!==o&&q.target===s; }); });
      var s=free[Math.floor(Math.random()*free.length)];
      var ok=s&&startWalk(o,{c:s.c,r:s.r},function(){ o.state='idle'; o.dir=s.face; o.until=performance.now()+4000+Math.random()*5000; showBalloon(o,s.b,2200); });
      if(ok) o.target=s; else { o.target=null; o.until=now+4000; }
    }
    o.x=o.seatX; o.feet=o.seatFeet; o.dir='down'; o.frame=0; return;
  }
  if(o.state==='idle'){
    if(now>o.until){ var back=function(){ o.state='sit'; o.target=null; o.tile=null; o.until=performance.now()+9000+Math.random()*14000; };
      if(!startWalk(o,{c:o.seat.c,r:o.seat.r},back)) back(); }
    return;
  }
  if(o.state==='walk'){
    var k=(now-o.stepStart)/STEP_MS;
    while(k>=1&&o.step<o.path.length-1){ o.step++; o.stepStart+=STEP_MS; k-=1; }
    var a=o.path[o.step], b=o.path[Math.min(o.step+1,o.path.length-1)];
    if(o.step>=o.path.length-1){ o.tile={c:a.c,r:a.r}; var pa=tilePos(a); o.x=pa.x; o.feet=pa.feet; o.frame=0; var fn=o.then; o.then=null; fn&&fn(); return; }
    var A=tilePos(a), B=tilePos(b);
    if(o.step===0&&a.c===o.seat.c&&a.r===o.seat.r) A={x:o.seatX,feet:o.seatFeet};
    if(b.c===o.seat.c&&b.r===o.seat.r&&o.step===o.path.length-2) B={x:o.seatX,feet:o.seatFeet};
    o.x=A.x+(B.x-A.x)*k; o.feet=A.feet+(B.feet-A.feet)*k;
    o.dir=b.c>a.c?'right':b.c<a.c?'left':b.r<a.r?'up':'down';
    o.frame=[1,0,2,0][Math.floor(now/STEP_MS*2)%4]; o.tile={c:a.c,r:a.r};
  }
}
people.forEach(function(o){ var k=WALKERS.indexOf(o.p.id); o.walker=k>=0;
  o.until=performance.now()+(k>=0?1200+k*2600:0)+Math.random()*2000; o.nextBlink=performance.now()+Math.random()*3000; });

function robotPos(t){ return { x:t.c*T+1, feet:t.r*T+24 }; }
function robotTalk(){ ROBOT.talk=R_LINES[Math.floor(Math.random()*R_LINES.length)]; ROBOT.talkUntil=performance.now()+4400; }
function robotUpdate(now){
  var R0=ROBOT;
  if(now>R0.nextBlink){ R0.blinkUntil=now+160; R0.nextBlink=now+2600+Math.random()*3000; }
  if(!R0.tile){ R0.tile=R_WAY[1]; var p0=robotPos(R0.tile); R0.x=p0.x; R0.feet=p0.feet; R0.wait=now+1200; }
  if(R0.path){
    var k=(now-R0.stepStart)/R_STEP;
    while(k>=1&&R0.step<R0.path.length-1){ R0.step++; R0.stepStart+=R_STEP; k-=1; }
    var a=R0.path[R0.step];
    if(R0.step>=R0.path.length-1){ R0.tile=a; var pa=robotPos(a); R0.x=pa.x; R0.feet=pa.feet; R0.path=null;
      R0.wait=now+700+Math.random()*1800; if(Math.random()<0.35){ robotTalk(); R0.wait+=2200; } return; }
    var A=robotPos(a), B=robotPos(R0.path[R0.step+1]); R0.x=A.x+(B.x-A.x)*k; R0.feet=A.feet+(B.feet-A.feet)*k; return;
  }
  if(now>R0.wait){
    var opts=R_WAY.filter(function(t){ return t!==R0.tile; }), goal=opts[Math.floor(Math.random()*opts.length)];
    var path=bfs({c:R0.tile.c,r:R0.tile.r},goal);
    if(path&&path.length>1){ R0.path=path; R0.step=0; R0.stepStart=now; R0.tile=goal; } else R0.wait=now+1500;
  }
}
var rTalk=document.getElementById('rTalk');

// =====================================================================
//  그리기
// =====================================================================
var lastBalloon=0;
function frame(now){
  var hm=nowHM(), ph=phase(hm.h);
  people.forEach(function(o){ update(o,now); }); robotUpdate(now);
  if(now-lastBalloon>2600){ lastBalloon=now; var sit=people.filter(function(o){ return o.state==='sit'; }), so=sit[Math.floor(Math.random()*sit.length)];
    if(so) showBalloon(so,['note','dots','bulb','sweat','heart','zzz'][Math.floor(Math.random()*6)],1900); }
  if(now-lastSay>9000&&!typing) say(people[Math.floor(Math.random()*people.length)]);

  wc.drawImage(bg,0,0);
  PO.drawWindow(wc,ph,now,hm,'sunny'); PO.drawClock(wc,hm);
  var list=things.slice(); list.push({draw:function(g){ PO.drawFish(g,now,false); },sy:5*T+0.5});
  list.push({sy:ROBOT.feet, draw:function(g){ var X=Math.round(ROBOT.x), F=Math.round(ROBOT.feet);
    var img=now<ROBOT.blinkUntil?ROBOT.blink:(ROBOT.path&&Math.floor(now/140)%2?ROBOT.roll:ROBOT.spr);
    ell(g,X+16,F,12,2,'rgba(60,70,90,0.2)'); g.drawImage(img,X,F-36); }});
  list.sort(function(a,b){ return (a.person?a.person.feet:a.sy)-(b.person?b.person.feet:b.sy); });
  list.forEach(function(it){
    if(it.person){ var o=it.person, img=(o.state==='sit'&&now<o.blinkUntil)?o.spr.blink:o.spr[o.dir][o.frame];
      var X=Math.round(o.x), Y=Math.round(o.feet)-48;
      if(o.state!=='sit') ell(wc,X+17,Math.round(o.feet),9,2,'rgba(90,50,70,0.22)');
      wc.drawImage(img,X,Y); }
    else if(it.draw) it.draw(wc);
    else wc.drawImage(it.img,it.x,it.y);
  });
  people.forEach(function(o){ if(o.balloon&&now<o.balloonUntil){ var bob=Math.round(Math.sin(now*0.012)*1.5);
    wc.drawImage(o.balloon,Math.round(o.x)+2,Math.round(o.feet)-48-24+bob); } });
  if(now<ROBOT.talkUntil){ rTalk.style.display='block'; rTalk.textContent=ROBOT.talk;
    rTalk.style.left=((ROBOT.x+16)*Z)+'px'; rTalk.style.top=((ROBOT.feet-40)*Z)+'px'; } else rTalk.style.display='none';
  var tint=TINT[ph];
  if(tint){ wc.save(); wc.globalCompositeOperation='multiply'; wc.globalAlpha=tint[1]; wc.fillStyle=tint[0]; wc.fillRect(0,0,W,H); wc.restore(); }
  if(ph==='night'||ph==='dusk'){ wc.save(); wc.globalCompositeOperation='lighter';    // 밤에는 모니터 불빛
    people.forEach(function(o){ if(o.state!=='sit') return; var cx=o.seat.c*T+32, cy=(o.seat.r+1)*T;
      wc.fillStyle='rgba(130,150,200,0.08)'; wc.fillRect(cx-30,cy-24,60,40); wc.fillStyle='rgba(130,150,200,0.06)'; wc.fillRect(cx-22,cy-32,44,56); });
    wc.restore(); }
  document.getElementById('clock').textContent=(hm.h<12?'오전 ':'오후 ')+(((hm.h+11)%12)+1)+':'+String(hm.m).padStart(2,'0');
  requestAnimationFrame(frame);
}

document.fonts&&document.fonts.load('16px NeoDGM').catch(function(){});
relayout();
setTimeout(function(){ document.getElementById('mapName').style.opacity='0'; },4200);
say(people[1]);
requestAnimationFrame(frame);
window.__pixel={ people:people, blocked:blocked, SPOTS:SPOTS, robot:ROBOT };
})();
</script>
</body>
</html>
