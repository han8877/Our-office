<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>끄적끄적문구 · 픽셀 시안</title>
<style>
  /* 둥근모꼴(NeoDunggeunmo) — SIL OFL 1.1, assets/fonts/neodgm-LICENSE.txt */
  @font-face{ font-family:'NeoDGM'; src:url('assets/fonts/neodgm.woff2') format('woff2'); font-display:block; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#15131c; overflow:hidden;
    font-family:'NeoDGM', monospace; -webkit-font-smoothing:none; -webkit-text-size-adjust:100%; }
  #view{ position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; cursor:grab; scrollbar-width:none; }
  #view::-webkit-scrollbar{ display:none; }
  #view.drag{ cursor:grabbing; }
  #stage{ position:relative; margin:64px auto 150px; }
  #world{ display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #labels{ position:absolute; left:0; top:0; pointer-events:none; }

  /* 책상 명패 */
  .plate{ position:absolute; font-size:16px; line-height:16px; color:#fff; white-space:nowrap;
    background:rgba(22,16,34,.80); padding:2px 5px; border-radius:3px; transform:translate(-50%,0);
    box-shadow:0 0 0 1px rgba(0,0,0,.45); }
  /* 구역 팻말: 나무판 */
  .zone{ position:absolute; font-size:16px; line-height:16px; color:#ffe9c4; white-space:nowrap;
    background:#7a4a2a; border:2px solid #3b2112; padding:3px 6px;
    box-shadow:inset 0 0 0 1px #a8703f, 2px 2px 0 rgba(0,0,0,.35); }
  /* 벽 간판 글씨 */
  .sign{ position:absolute; font-size:16px; line-height:16px; color:#ffe9c4; white-space:nowrap;
    transform:translate(-50%,-50%); text-shadow:1px 1px 0 #2b1608; }

  /* 쯔꾸르 창 */
  .win{ position:fixed; color:#fff; font-size:16px; line-height:22px;
    background:linear-gradient(180deg, rgba(46,66,140,.94), rgba(18,28,76,.94));
    border:3px solid #e9eef6; border-radius:6px;
    box-shadow:0 0 0 2px #171c36, inset 0 0 0 1px rgba(255,255,255,.18), 0 4px 0 rgba(0,0,0,.35);
    text-shadow:2px 2px 0 #0b0f24; }
  #mapName{ left:12px; top:calc(12px + env(safe-area-inset-top,0px)); padding:8px 14px; transition:opacity .9s; }
  #mapName small{ display:block; font-size:16px; color:#b9c6ff; }
  #clock{ right:12px; top:calc(12px + env(safe-area-inset-top,0px)); padding:6px 12px; }
  #msg{ left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    max-width:760px; margin:0 auto; min-height:98px; padding:12px 16px 14px 100px; cursor:pointer; }
  #msgFace{ position:absolute; left:14px; top:13px; width:72px; height:72px; image-rendering:pixelated;
    background:rgba(0,0,0,.22); border-radius:4px; }
  #msgName{ display:block; color:#ffe08a; }
  #msgText{ display:block; min-height:44px; }
  #msgNext{ position:absolute; right:14px; bottom:6px; animation:blink .8s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion:reduce){ #msgNext{ animation:none; } }
</style>
</head>
<body>
<div id="view"><div id="stage"><canvas id="world"></canvas><div id="labels"></div></div></div>
<div id="mapName" class="win">끄적끄적문구 · 3층 사무실<small>화면을 끌어서 둘러보세요</small></div>
<div id="clock" class="win">--:--</div>
<div id="msg" class="win"><canvas id="msgFace" width="18" height="18"></canvas><span id="msgName"></span><span id="msgText"></span><span id="msgNext">▼</span></div>

<script>
(function(){
'use strict';

// =====================================================================
//  기본 단위: 타일 16px. 맵은 36 × 30 칸. 그림은 이 원래 크기로 그리고
//  화면에는 정수배로 키워서 보여준다 (픽셀이 뭉개지지 않게).
// =====================================================================
var T = 16, COLS = 36, ROWS = 30, W = COLS * T, H = ROWS * T;

// ---------- 색 ----------
function h2r(h){ h = h.replace('#',''); var n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function r2h(r,g,b){ return '#' + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
function mix(a,b,t){ var A=h2r(a), B=h2r(b);
  return r2h(Math.round(A[0]+(B[0]-A[0])*t), Math.round(A[1]+(B[1]-A[1])*t), Math.round(A[2]+(B[2]-A[2])*t)); }
// 그림자는 보랏빛으로, 빛은 노란빛으로 — 픽셀아트에서 쓰는 색 이동
function sh(c,k){ return k < 0 ? mix(c,'#26172e',-k) : mix(c,'#fff5d8',k); }
function rnd(n){ var x = Math.sin(n*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hash(s){ var h = 2166136261; for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }

// ---------- 그리기 도구 (전부 정수 좌표, 안티앨리어싱 없음) ----------
function cv(w,h){ var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function R(g,x,y,w,h,c){ g.fillStyle = c; g.fillRect(x,y,w,h); }
function P(g,x,y,c){ g.fillStyle = c; g.fillRect(x,y,1,1); }
function ell(g,cx,cy,rx,ry,c){ g.fillStyle = c;
  for(var y=-ry;y<=ry;y++){ var w = Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/((ry+0.35)*(ry+0.35))))); g.fillRect(cx-w,cy+y,w*2+1,1); } }
function disc(g,cx,cy,r,c){ ell(g,cx,cy,r,r,c); }
function line(g,x0,y0,x1,y1,c){ g.fillStyle = c;
  var dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, e=dx+dy;
  for(;;){ g.fillRect(x0,y0,1,1); if(x0===x1 && y0===y1) break; var e2=2*e; if(e2>=dy){ e+=dy; x0+=sx; } if(e2<=dx){ e+=dx; y0+=sy; } } }

// 외곽선: 투명한 칸이 채워진 칸과 닿으면 그 색을 어둡게 한 선을 두른다 (셀아웃)
function outline(c){
  var g = c.getContext('2d'), w = c.width, h = c.height;
  var id = g.getImageData(0,0,w,h), d = id.data, o = new Uint8ClampedArray(d);
  var DK = [30,17,24], t = 0.74;
  for(var y=0;y<h;y++) for(var x=0;x<w;x++){
    var i = (y*w+x)*4; if(d[i+3] > 40) continue;
    var j = -1;
    if(y+1<h && d[((y+1)*w+x)*4+3] > 160) j = ((y+1)*w+x)*4;
    else if(x+1<w && d[(y*w+x+1)*4+3] > 160) j = (y*w+x+1)*4;
    else if(x>0 && d[(y*w+x-1)*4+3] > 160) j = (y*w+x-1)*4;
    else if(y>0 && d[((y-1)*w+x)*4+3] > 160) j = ((y-1)*w+x)*4;
    if(j < 0) continue;
    o[i]=Math.round(d[j]*(1-t)+DK[0]*t); o[i+1]=Math.round(d[j+1]*(1-t)+DK[1]*t); o[i+2]=Math.round(d[j+2]*(1-t)+DK[2]*t); o[i+3]=255;
  }

// 물건 하나를 작은 캔버스에 그리고 외곽선을 두른다. 둘레 1px 는 외곽선 자리
function obj(w,h,paint,noLine){ var c = cv(w+2,h+2), g = c.getContext('2d');
  g.save(); g.translate(1,1); paint(g,w,h); g.restore(); if(!noLine) outline(c); return c; }

// =====================================================================
//  바닥 · 카펫 · 벽
// =====================================================================
function paintWoodFloor(g){
  for(var y=0; y<H; y+=4){

    while(x < W){

      var b = tn < 0.33 ? '#c68e56' : tn < 0.66 ? '#cf985f' : '#bd844e';
      R(g,x,y,len,4,b); R(g,x,y,len,1,sh(b,0.14)); R(g,x,y+3,len,1,sh(b,-0.2)); R(g,x+len-1,y,1,4,sh(b,-0.32));
      if(rnd(row+x*0.1) > 0.55) R(g,x+Math.floor(len*0.45),y+1,3,1,sh(b,-0.07));
      x += len;
    }
  }
}
function carpet(g,c0,r0,c1,r1,base){
  var x=c0*T, y=r0*T, w=(c1-c0+1)*T, h=(r1-r0+1)*T, dk=sh(base,-0.3), lt=sh(base,0.16);
  R(g,x,y,w,h,base);
  for(var yy=6; yy<h-5; yy+=8) for(var xx=6+((yy>>3)%2)*4; xx<w-5; xx+=8){
    P(g,x+xx,y+yy,lt); P(g,x+xx-1,y+yy,sh(base,0.08)); P(g,x+xx+1,y+yy,sh(base,0.08)); P(g,x+xx,y+yy-1,sh(base,0.08)); P(g,x+xx,y+yy+1,sh(base,0.08)); }
  R(g,x,y,w,2,dk); R(g,x,y+h-2,w,2,dk); R(g,x,y,2,h,dk); R(g,x+w-2,y,2,h,dk);
  R(g,x+3,y+3,w-6,1,lt); R(g,x+3,y+h-4,w-6,1,lt); R(g,x+3,y+3,1,h-6,lt); R(g,x+w-4,y+3,1,h-6,lt);
  g.fillStyle = 'rgba(40,18,24,0.22)'; g.fillRect(x+2,y+h,w-2,2);
}
function kitchenTiles(g,c0,r0,c1,r1){
  var x0=c0*T, y0=r0*T, w=(c1-c0+1)*T, h=(r1-r0+1)*T;
  for(var y=0;y<h;y+=8) for(var x=0;x<w;x+=8){
    var a = ((x>>3)+(y>>3))%2 ? '#f3efe4' : '#dfe8ea';
    R(g,x0+x,y0+y,8,8,a); R(g,x0+x,y0+y,8,1,'#c9c4b8'); R(g,x0+x,y0+y,1,8,'#c9c4b8'); P(g,x0+x+2,y0+y+2,'#ffffff');
  }
}
function concrete(g,c0,r0,c1,r1){
  var x0=c0*T, y0=r0*T, w=(c1-c0+1)*T, h=(r1-r0+1)*T;
  R(g,x0,y0,w,h,'#b7b1a6');
  for(var i=0;i<w*h/40;i++){ P(g,x0+Math.floor(rnd(i*1.3)*w), y0+Math.floor(rnd(i*2.7)*h), rnd(i)>0.5?'#a9a397':'#c4bfb5'); }
  for(var x=0;x<w;x+=32) R(g,x0+x,y0,1,h,'#9f998e');
  for(var y=0;y<h;y+=32) R(g,x0,y0+y,w,1,'#9f998e');
}

var WALL_CAP = '#5b4536', WALL_PAPER = '#f1e3c6', WAINSCOT = '#b88657', BASEBOARD = '#6b4527';
function paintOuterWalls(g){
  // 위쪽 벽: 두께(윗면) 한 칸 + 벽면 두 칸
  R(g,0,0,W,T,WALL_CAP); R(g,0,0,W,2,'#7a5e4a'); R(g,0,T-2,W,2,'#3d2c22');
  var fy = T, fh = 2*T;
  R(g,0,fy,W,fh,WALL_PAPER);
  for(var x=2;x<W;x+=6) R(g,x,fy,1,fh-11,'#e8d6b2');
  R(g,0,fy+fh-11,W,9,WAINSCOT); R(g,0,fy+fh-11,W,1,'#d6a676');
  for(var x2=0;x2<W;x2+=16){ R(g,x2,fy+fh-10,1,8,'#8e6038'); R(g,x2+1,fy+fh-10,1,8,'#c99a68'); }
  R(g,0,fy+fh-2,W,2,BASEBOARD);
  g.fillStyle='rgba(30,14,10,0.30)'; g.fillRect(0,fy+fh,W,3);
  g.fillStyle='rgba(30,14,10,0.13)'; g.fillRect(0,fy+fh+3,W,3);
  // 옆·아래 벽은 윗면만 보인다
  R(g,0,0,T,H,WALL_CAP); R(g,T-2,0,2,H,'#3d2c22'); R(g,0,0,2,H,'#7a5e4a');
  R(g,W-T,0,T,H,WALL_CAP); R(g,W-T,0,2,H,'#3d2c22'); R(g,W-2,0,2,H,'#7a5e4a');
  R(g,0,H-T,W,T,WALL_CAP); R(g,0,H-T,W,2,'#3d2c22'); R(g,0,H-2,W,2,'#7a5e4a');
  g.fillStyle='rgba(30,14,10,0.22)'; g.fillRect(T,fy+fh,3,H-fy-fh-T);
}
// 칸막이 벽 (가로): 윗면 6px + 벽면 16px + 바닥 그림자
function hWall(len){
  return obj(len,24,function(g,w){
    R(g,0,0,w,6,WALL_CAP); R(g,0,0,w,1,'#7a5e4a'); R(g,0,5,w,1,'#3d2c22');
    R(g,0,6,w,10,WALL_PAPER); for(var x=2;x<w;x+=6) R(g,x,6,1,10,'#e8d6b2');
    R(g,0,16,w,4,WAINSCOT); R(g,0,16,w,1,'#d6a676'); R(g,0,20,w,2,BASEBOARD);
    g.fillStyle='rgba(30,14,10,0.28)'; g.fillRect(0,22,w,2);
  }, true);
}
function glassWall(len){
  return obj(len,24,function(g,w){
    R(g,0,0,w,3,'#56606b'); R(g,0,0,w,1,'#7d8994');
    g.fillStyle='rgba(168,214,236,0.42)'; g.fillRect(0,3,w,16);
    g.fillStyle='rgba(255,255,255,0.55)'; for(var x=4;x<w;x+=32){ g.fillRect(x+6,5,1,6); g.fillRect(x+8,5,1,3); }
    for(var x2=0;x2<=w;x2+=32) R(g,Math.min(x2,w-2),3,2,16,'#56606b');
    R(g,0,19,w,3,'#56606b'); R(g,0,19,w,1,'#7d8994');
    g.fillStyle='rgba(30,14,10,0.2)'; g.fillRect(0,22,w,2);
  }, true);
}
function vWall(len,glass){
  return obj(6,len,function(g,w,h){
    R(g,0,0,6,h,glass ? '#56606b' : WALL_CAP); R(g,0,0,1,h,glass ? '#7d8994' : '#7a5e4a'); R(g,5,0,1,h,'#3d2c22');
  }, true);
}

// =====================================================================
//  가구 (전부 3/4 시점: 윗면이 밝고 앞면이 어둡다)
// =====================================================================
var WOOD_TOP = '#dcae72', WOOD_FR = '#a8723f';

function pDesk(seed){
  return obj(32,26,function(g){
    R(g,0,8,32,10,WOOD_TOP); R(g,0,8,32,1,sh(WOOD_TOP,0.28)); R(g,0,17,32,1,sh(WOOD_TOP,-0.14));
    R(g,0,18,32,8,WOOD_FR); R(g,0,18,32,1,sh(WOOD_FR,-0.32)); R(g,1,25,30,1,sh(WOOD_FR,-0.2));
    R(g,11,20,10,4,sh(WOOD_FR,0.12)); R(g,11,23,10,1,sh(WOOD_FR,-0.16)); R(g,15,21,2,1,'#3a2418');
    R(g,0,18,1,8,sh(WOOD_FR,-0.26)); R(g,31,18,1,8,sh(WOOD_FR,-0.26));
    // 노트북 — 앉은 사람 옆에, 화면 뒷면이 보이게
    var lx = rnd(seed) < 0.5 ? 0 : 23;
    R(g,lx,4,9,7,'#c3cad2'); R(g,lx,4,9,1,'#e6ebef'); R(g,lx+8,4,1,7,'#9aa3ad'); R(g,lx,11,9,1,'#8a929c');
    P(g,lx+4,7,'#ffffff'); P(g,lx+4,8,'#ffffff');
    var ox = lx === 0 ? 26 : 1, t = Math.floor(rnd(seed+1)*4);
    if(t === 0){ R(g,ox,9,4,5,'#e86a5a'); R(g,ox,9,4,1,sh('#e86a5a',0.35)); P(g,ox+4,10,'#e86a5a'); P(g,ox+4,11,'#e86a5a'); R(g,ox+1,9,2,1,'#5a2c1c'); }
    else if(t === 1){ R(g,ox,8,4,6,'#6f8fb8'); R(g,ox,8,4,1,sh('#6f8fb8',0.35)); P(g,ox,5,'#f0c040'); P(g,ox,6,'#f0c040'); P(g,ox,7,'#f0c040'); P(g,ox+1,4,'#e05050'); P(g,ox+1,5,'#e05050'); P(g,ox+1,6,'#e05050'); P(g,ox+1,7,'#e05050'); P(g,ox+3,6,'#50a060'); P(g,ox+3,7,'#50a060'); }
    else if(t === 2){ R(g,ox,10,5,4,'#c9653a'); R(g,ox,10,5,1,sh('#c9653a',0.35)); disc(g,ox+2,7,2,'#5a9c48'); P(g,ox+2,5,'#8ccf6a'); P(g,ox+1,7,'#8ccf6a'); }
    else { R(g,ox,7,6,7,'#f4efe4'); R(g,ox+1,8,4,4,'#9fd0e6'); R(g,ox+1,10,4,2,'#7ab060'); }
    var px = lx === 0 ? 11 : 15;
    R(g,px,12,6,4,'#fbfaf3'); R(g,px,12,6,1,'#ffffff'); R(g,px+1,13,4,1,'#b9b4a8'); R(g,px+1,15,3,1,'#b9b4a8');
  });
}
function pChairBack(){
  return obj(18,11,function(g){ var c='#56606e';
    R(g,1,0,16,9,c); R(g,0,1,18,7,c); R(g,1,0,16,1,sh(c,0.32)); R(g,2,1,14,1,sh(c,0.15)); R(g,8,9,2,2,'#353a44'); });
}
function pAquarium(){
  return obj(64,40,function(g){
    R(g,0,27,64,3,'#9a6a40'); R(g,0,27,64,1,sh('#9a6a40',0.32));
    R(g,1,30,62,10,'#7a4e2c'); R(g,1,30,62,1,sh('#7a4e2c',-0.32)); R(g,31,31,1,8,'#5a3820');
    R(g,27,34,2,2,'#e2c070'); R(g,35,34,2,2,'#e2c070');
    R(g,1,2,62,25,'#6a8290');
    R(g,2,3,60,4,'#c4ecf4'); R(g,2,6,60,1,'#8fd2e6');
    R(g,2,7,60,6,'#63bddf'); R(g,2,13,60,6,'#51aad4'); R(g,2,19,60,4,'#4499c6');
    R(g,2,22,60,4,'#e2cb90'); R(g,2,22,60,1,sh('#e2cb90',0.22));
    for(var i=0;i<16;i++) P(g,4+Math.floor(rnd(i+3)*56),23+Math.floor(rnd(i+9)*3), rnd(i)>0.5?'#b8a070':'#f4e6c0');
    [[7,'#3f8f4a',11],[10,'#5aa85a',8],[49,'#3f8f4a',12],[53,'#5aa85a',9],[57,'#3f8f4a',7]].forEach(function(p){
      for(var y=0;y<p[2];y++) P(g,p[0]+((y%4)<2?0:1),21-y,p[1]); });
    line(g,24,21,36,18,'#7a5030'); line(g,25,22,37,19,'#5e3a20'); line(g,30,19,33,15,'#7a5030');
    R(g,4,8,6,7,'#d7dde2'); R(g,4,8,6,1,'#f2f5f7'); R(g,5,15,1,6,'#c0c8cf');
    line(g,40,8,46,20,'rgba(255,255,255,0.5)'); line(g,43,8,47,16,'rgba(255,255,255,0.3)');
    R(g,1,2,62,1,'#8fa4b0'); R(g,1,26,62,1,'#556a76');
  });
}
function pSofa(col){
  return obj(64,28,function(g){ var dk=sh(col,-0.22), lt=sh(col,0.18);
    R(g,4,0,56,10,col); R(g,4,0,56,1,lt); R(g,4,9,56,1,dk);
    R(g,0,5,7,21,sh(col,-0.08)); R(g,0,5,7,1,lt); R(g,57,5,7,21,sh(col,-0.08)); R(g,57,5,7,1,lt);
    R(g,7,10,50,9,lt); R(g,7,10,50,1,sh(col,0.32)); R(g,24,10,1,9,dk); R(g,40,10,1,9,dk);
    R(g,7,19,50,7,dk); R(g,7,19,50,1,sh(col,-0.38));
    R(g,2,26,3,2,'#3a2418'); R(g,59,26,3,2,'#3a2418');
  });
}

function bfs(start, goal){

    if(cur.c === goal.c && cur.r === goal.r){ var path=[cur]; var k=key(cur.c,cur.r); while(prev[k]){ path.unshift(prev[k]); k=key(prev[k].c,prev[k].r); } return path; }
    [[0,1],[1,0],[0,-1],[-1,0]].forEach(function(d){ var nc=cur.c+d[0], nr=cur.r+d[1], k2=key(nc,nr);
      if(nc<0||nr<0||nc>=COLS||nr>=ROWS||seen[k2]) return;

}

var STEP_MS = 260;
function startWalk(o, target, then){

  o.path = path; o.step = 0; o.stepStart = performance.now(); o.then = then; o.state = 'walk';

}

    if(o.walker && now > o.until){
      var free = SPOTS.filter(function(s){ return !people.some(function(q){ return q !== o && q.target === s; }); });
      var s = free[Math.floor(Math.random()*free.length)];
      var ok = s && startWalk(o, {c:s.c, r:s.r}, function(){ o.state='idle'; o.dir=s.face; o.until = performance.now() + 4000 + Math.random()*5000; showBalloon(o, s.b, 2200); });
      if(ok) o.target = s; else { o.target = null; o.until = now + 4000; }
    }

  if(o.state === 'idle'){
    if(now > o.until){
      var back = function(){ o.state='sit'; o.target=null; o.tile=null; o.until = performance.now() + 9000 + Math.random()*14000; };
      if(!startWalk(o, {c:o.seat.c, r:o.seat.r}, back)) back();
    }
    return;
  }
  if(o.state === 'walk'){
    var k = (now - o.stepStart) / STEP_MS;
    while(k >= 1 && o.step < o.path.length-1){ o.step++; o.stepStart += STEP_MS; k -= 1; }
    var a = o.path[o.step], b = o.path[Math.min(o.step+1, o.path.length-1)];

}

  people.forEach(function(o){ update(o, now); });
  if(now - lastBalloon > 2600){ lastBalloon = now; var sitters = people.filter(function(o){ return o.state==='sit'; });
    var o = sitters[Math.floor(Math.random()*sitters.length)]; if(o) showBalloon(o, ['note','dots','bulb','sweat','heart','zzz'][Math.floor(Math.random()*6)], 1900); }
  if(now - lastSay > 9000 && !typing) say(people[Math.floor(Math.random()*people.length)]);

  wc.drawImage(bg,0,0);
  drawWindow(wc, ph, now);
  drawClock(wc);

  // 사람과 물건을 발 위치 순서로 — 뒤에 있는 것부터
  var list = things.slice();
  list.push({draw:function(g){ drawFish(g, now); }, sy:5*T - 0.5});
  list.sort(function(a,b){ var ay = a.person ? a.person.feet : a.sy, by = b.person ? b.person.feet : b.sy; return ay - by; });
  list.forEach(function(it){
    if(it.person){ var o = it.person, img;
      if(o.state === 'sit' && now < o.blinkUntil) img = o.spr.blink; else img = o.spr[o.dir][o.frame];
      var X = Math.round(o.x), Y = Math.round(o.feet) - 21;
      if(o.state !== 'sit'){ wc.fillStyle='rgba(30,14,20,0.28)'; wc.fillRect(X+5,Y+21,8,2); wc.fillRect(X+4,Y+22,10,1); }
      wc.drawImage(img, X, Y);
    }
    else if(it.draw) it.draw(wc);
    else wc.drawImage(it.img, it.x, it.y);
  });
  // 말풍선은 맨 위에
  people.forEach(function(o){ if(o.balloon && now < o.balloonUntil){
    var bob = Math.round(Math.sin(now*0.012)*1), X = Math.round(o.x)+2, Y = Math.round(o.feet) - 21 - 12 + bob;
    wc.drawImage(o.balloon, X, Y); } });

  var tint = TINT[ph];
  if(tint){ wc.save(); wc.globalCompositeOperation='multiply'; wc.globalAlpha=tint[1]; wc.fillStyle=tint[0]; wc.fillRect(0,0,W,H); wc.restore(); }
  if(ph === 'night' || ph === 'dusk'){
    // 밤에는 책상마다 노트북 불빛
    wc.save(); wc.globalCompositeOperation='lighter';
    people.forEach(function(o){ if(o.state!=='sit') return; var cx=o.seat.c*T+16, cy=(o.seat.r+1)*T;
      wc.fillStyle='rgba(120,150,210,0.10)'; wc.fillRect(cx-14,cy-12,28,18); wc.fillStyle='rgba(120,150,210,0.08)'; wc.fillRect(cx-10,cy-16,20,26); });
    wc.restore();
  }
  document.getElementById('clock').textContent = (hm.h<12?'오전 ':'오후 ') + (((hm.h+11)%12)+1) + ':' + String(hm.m).padStart(2,'0');
  requestAnimationFrame(frame);
}

// 시작
document.fonts && document.fonts.load('16px NeoDGM').catch(function(){});
relayout();
setTimeout(function(){ var mn = document.getElementById('mapName'); mn.style.opacity = '0'; }, 4200);
say(people[1]);
requestAnimationFrame(frame);
window.__pixel = { people:people, blocked:blocked, SPOTS:SPOTS };
})();
</script>
